<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Lost &amp; Found</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="nav">
  <div class="container">
    <a class="brand" href="index.html"><span class="brand-mark">↗</span> Lost &amp; Found</a>
    <nav id="nav-actions" class="nav-actions"></nav>
  </div>
</header>

<main class="container" style="padding: 44px 0 60px">
  <div class="eyebrow">Admin panel</div>
  <h1 style="margin-bottom:28px">Platform overview</h1>

  <div class="dashboard-grid" style="grid-template-columns: repeat(5,1fr); margin-bottom:36px">
    <div class="dash-stat"><b id="stat-users">–</b><span>Users</span></div>
    <div class="dash-stat"><b id="stat-lost">–</b><span>Lost reports</span></div>
    <div class="dash-stat"><b id="stat-found">–</b><span>Found reports</span></div>
    <div class="dash-stat"><b id="stat-returned">–</b><span>Returned</span></div>
    <div class="dash-stat"><b id="stat-pending">–</b><span>Pending claims</span></div>
  </div>

  <section style="margin-bottom:36px">
    <h2 style="margin-bottom:16px">All reports</h2>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>#</th><th>Title</th><th>Type</th><th>Reporter</th><th>Status</th><th></th></tr></thead>
        <tbody id="admin-items"><tr><td colspan="6" class="empty-cell">Loading…</td></tr></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2 style="margin-bottom:16px">All claims</h2>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>#</th><th>Item</th><th>Claimant</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="admin-claims"><tr><td colspan="5" class="empty-cell">Loading…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
