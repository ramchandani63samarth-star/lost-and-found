<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Lost &amp; Found</title>
  <link rel="stylesheet" href="css/style.css">
 <link rel="icon" type="image/x-icon" href="/favicon.ico"> <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"> <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"> <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>

<header class="nav">
  <div class="container">
    <a class="brand" href="index.html"><span class="brand-mark">↗</span> Lost &amp; Found</a>
  </div>
</header>

<main class="form-wrap">
  <form class="form-card" id="auth-form" data-mode="login" novalidate>
    <div class="eyebrow">Welcome back</div>
    <h1>Sign in</h1>
    <p class="lead">Access your reports and claims.</p>
    <label>Email <span class="req">*</span>
      <input type="email" name="email" autocomplete="email" required>
    </label>
    <label>Password <span class="req">*</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary" type="submit">Login</button>
    <p style="margin-top:16px;font-size:14px;color:var(--muted)">New here? <a class="text-link" href="register.html">Create an account</a></p>
  </form>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
